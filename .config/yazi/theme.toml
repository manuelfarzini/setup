[mgr]
# root
cwd = { fg = "#9ea75b", bold = true }
# sort
sort_by = "natural"
sort_sensitive = false
sort_dir_first = true
# find
find_keyword = { fg = "#ffffff", bg = "#26261c" }
find_positon = { fg = "#ffffff", bg = "#26261c" }
# marker
marker_marked = { fg = "#757559", bg = "#757559" }
marker_selected = { fg = "#26261c", bg = "#26261c" }
marker_copied = { fg = "#9ea75b", bg = "#9ea75b" }
marker_cut = { fg = "#c6983b", bg = "#c6983b" }
count_copied = { fg = "#26261c", bg = "#9ea75b" }
count_cut = { fg = "#26261c", bg = "#c6983b" }
# border
border_style = { fg = "#a9a98a" }

[indicator]
parent = { fg = "#26261c", bg = "#e8e8db", bold = true }
current = { fg = "#26261c", bg = "#e8e8db", bold = true }
preview = { fg = "#26261c", bg = "#e8e8db", bold = true }

[mode]
normal_main = { fg = "#26261c", bg = "#e8e8db", bold = true }
normal_alt = { fg = "#f3f3eb", bg = "#626246", bold = false }
select_main = { fg = "#26261c", bg = "#e8e8db", bold = true }
select_alt = { fg = "#f3f3eb", bg = "#626246", bold = false }
unset_main = { fg = "#26261c", bg = "#e8e8db", bold = true }
unset_alt = { fg = "#f3f3eb", bg = "#626246", bold = false }

[status]
overall = { fg = "#26261c", bg = "#dedecc" }
# progress
progress_label = { fg = "#26261c", bg = "#e8e8db", bold = false }
progress_normal = { fg = "#26261c", bg = "#e8e8db", bold = false }
progress_error = { fg = "#26261c", bg = "#e8e8db", bold = false }
# permissions
perm_read = { fg = "#626246" }
perm_write = { fg = "#626246" }
perm_exec = { fg = "#626246" }
perm_sep = { fg = "#26261c" }

[which]
mask = { fg = "#9d9d68" }

[filetype]
rules = [
    { url = "*", fg = "#26261c" },
    { url = "*/", fg = "#626246", bold = true },
]

[icon]
dirs = [
    { name = "Desktop", text = "", fg = "#626246" }, 
    { name = "Documents", text = "", fg = "#626246" }, 
    { name = "Downloads", text = "", fg = "#626246" }, 
    { name = "Library", text = "", fg = "#626246" }, 
    { name = "Movies", text = "", fg = "#626246" }, 
    { name = "Music", text = "", fg = "#626246" }, 
    { name = "Personal", text = "", fg = "#626246" },
    { name = "Pictures", text = "", fg = "#626246" }, 
]
prepend_conds = [
    { if = "dir", text = "", fg = "#626246" }, 
]
prepend_exts = [
    { name = "rs", text = "", fg = "#26261c" },
    { name = "lua", text = "", fg = "#26261c" },
    { name = "txt", text = "", fg = "#26261c" },
