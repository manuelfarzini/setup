    { name = "png", text = "", fg = "#26261c" },
    { name = "jpg", text = "", fg = "#26261c" },
    { name = "ini", text = "", fg = "#26261c" },
    { name = "toml", text = "", fg = "#26261c" },
    { name = "config", text = "", fg = "#26261c" },
    { name = "mp3", text = "", fg = "#26261c" },
