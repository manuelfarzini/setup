    { name = "md", text = "", fg = "#26261c" },
    { name = "pdf", text = "", fg = "#26261c" },
    { name = "go", text = "󰟓", fg = "#26261c" },
    { name = "c", text = "", fg = "#26261c" },
    { name = "cc", text = "", fg = "#26261c" },
    { name = "cpp", text = "", fg = "#26261c" },
